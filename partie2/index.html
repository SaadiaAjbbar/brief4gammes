<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Typing Game</h1>
    <p id="textpara"></p>

    <input type="text" id="input" placeholder="write here" autocomplete="off" autofocus/>

    <p>chrono: <span id="timer">0</span> secondes</p>
    <p>Score : <span id="score">0</span></p>
    <button id="restart" onclick="window.location.reload()">Rejouer</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
